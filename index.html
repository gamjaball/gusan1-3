<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 1학년 3반 우리들의 공간</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .main-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; font-size: 16px; }
        .menu-btn { display: block; width: 100%; padding: 15px 0; background: #4a90e2; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3); }
        .menu-btn:hover { background: #357abd; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4); }
    </style>
</head>
<body>
    <div class="main-card">
        <h1>🏫 1학년 3반</h1>
        <p>우리 반 친구들 모두 환영해! 👋</p>
        <!-- board.html로 이동하는 버튼 -->
        <a href="board.html" class="menu-btn">자유게시판 입장하기</a>
    </div>
</body>
</html>
